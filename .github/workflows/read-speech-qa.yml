# Disposable repository QA only; never merge or use this as a production worker.
# Public standard runner, no checkout/token permissions, secrets, caches or uploaded artifacts.
name: Bounded read-speech QA
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/read-speech-qa.yml']
    types: [opened]
permissions: {}
jobs:
  read-speech:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/pinned-read-speech-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - name: Install isolated, version-pinned CPU benchmark dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asr-qa"
          source "$RUNNER_TEMP/asr-qa/bin/activate"
          python -m pip --isolated --disable-pip-version-check --no-cache-dir install --index-url https://pypi.org/simple --only-binary=:all: --no-deps --retries 1 --timeout 30 \
            faster-whisper==1.1.1 ctranslate2==4.5.0 av==14.0.1 \
            huggingface-hub==0.27.1 tokenizers==0.21.0 onnxruntime==1.20.1 \
            tqdm==4.67.1 numpy==1.26.4 pyarrow==18.1.0 \
            setuptools==75.6.0 PyYAML==6.0.2 requests==2.32.3 \
            certifi==2024.12.14 charset-normalizer==3.4.0 idna==3.10 urllib3==2.3.0 \
            filelock==3.16.1 fsspec==2024.12.0 packaging==24.2 typing-extensions==4.12.2 \
            coloredlogs==15.0.1 humanfriendly==10.0 flatbuffers==24.12.23 \
            protobuf==5.29.3 sympy==1.13.3 mpmath==1.3.0
          python -m pip check
          python -m pip freeze
      - name: Fetch verified public test assets and evaluate locally
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/asr-qa/bin/activate"
          python - <<'PY'
          import hashlib, io, math, os, pathlib, re, tempfile, time, urllib.request
          from huggingface_hub import HfApi
          import pyarrow.parquet as pq
          from faster_whisper import WhisperModel

          # Only published CC BY 4.0 read-speech fixtures from LibriSpeech
          # (Panayotov et al.; subset by sanchit-gandhi), not customer data.
          # https://huggingface.co/datasets/sanchit-gandhi/librispeech_asr_dummy
          # https://creativecommons.org/licenses/by/4.0/
          # MIT model: https://huggingface.co/Systran/faster-whisper-tiny
          # Public aggregate metrics only; no audio, transcript or speaker IDs in logs.
          repo = "Systran/faster-whisper-tiny"
          revision = "518d6e0b5a068b278f66842b17377f9523de5cd1"
          model_hash = "dcb76c6586fc06cbdac6dd21f14cfd129cc4cdd9dce19bf4ffa62e59cbe6e6d1"
          data_hash = "a6fa5da4f5d77d07b8d504a4ceb2785a43d81d9f40478a6e1cd16828b780b2fe"
          data_url = ("https://huggingface.co/datasets/sanchit-gandhi/librispeech_asr_dummy/"
                      "resolve/main/data/test.clean-00000-of-00001-f9b7d4171ec2790c.parquet")
          def download(url, limit):
              with urllib.request.urlopen(url, timeout=30) as res:
                  b = res.read(limit + 1)
              if not b or len(b) > limit:
                  raise RuntimeError("Empty or oversized test asset")
              return b
          def sha256(b):
              return hashlib.sha256(b).hexdigest()
          def git_blob_id(b):
              return hashlib.sha1(b"blob " + str(len(b)).encode() + b"\0" + b).hexdigest()
          def words(s):
              return re.findall(r"[a-z0-9]+(?:'[a-z0-9]+)?", s.lower().replace("’", "'"))
          def distance(a, b):
              prev = list(range(len(b) + 1))
              for i, x in enumerate(a, 1):
                  curr = [i]
                  for j, y in enumerate(b, 1):
                      curr.append(min(curr[-1] + 1, prev[j] + 1, prev[j-1] + (x != y)))
                  prev = curr
              return prev[-1]

          with tempfile.TemporaryDirectory() as tmp:
              folder = pathlib.Path(tmp)
              metadata = {x.path: x for x in HfApi(token=False).list_repo_tree(repo, revision=revision)}
              for name, limit in (("config.json", 100_000), ("tokenizer.json", 3_000_000),
                                  ("vocabulary.txt", 1_000_000), ("model.bin", 80_000_000)):
                  content = download(f"https://huggingface.co/{repo}/resolve/{revision}/{name}", limit)
                  if name == "model.bin":
                      if sha256(content) != model_hash:
                          raise RuntimeError("Model SHA256 mismatch")
                  elif git_blob_id(content) != metadata[name].blob_id:
                      raise RuntimeError("Pinned model file Git blob mismatch")
                  (folder / name).write_bytes(content)
                  print(f"Verified {name}: sha256={sha256(content)}", flush=True)
              dataset = download(data_url, 4_000_000)
              if sha256(dataset) != data_hash:
                  raise RuntimeError("Dataset SHA256 mismatch")
              print(f"Verified read-speech data: sha256={sha256(dataset)}", flush=True)
              os.environ["HF_HUB_OFFLINE"] = "1"
              model = WhisperModel(str(folder), device="cpu", compute_type="int8",
                                   cpu_threads=2, local_files_only=True)
              rows = pq.read_table(io.BytesIO(dataset), columns=["audio", "text"]).slice(0, 20).to_pylist()
              if len(rows) < 10:
                  raise RuntimeError("Insufficient fixture samples")
              errors = reference_words = timed_words = bad_timestamps = 0
              duration = 0.0
              start = time.monotonic()
              for row in rows:
                  ref = words(row["text"])
                  if not ref or not row["audio"]["bytes"]:
                      raise RuntimeError("Missing fixture reference or audio")
                  segs, info = model.transcribe(io.BytesIO(row["audio"]["bytes"]),
                      language="en", beam_size=5, word_timestamps=True,
                      condition_on_previous_text=False, vad_filter=False)
                  segs = list(segs)
                  predicted = words(" ".join(s.text for s in segs))
                  if not math.isfinite(info.duration) or not 0 < info.duration <= 60:
                      raise RuntimeError("Unexpected fixture duration")
                  duration += info.duration
                  errors += distance(ref, predicted)
                  reference_words += len(ref)
                  previous = 0.0
                  sample_timed = 0
                  for s in segs:
                      for w in s.words or []:
                          sample_timed += 1
                          timed_words += 1
                          if (not math.isfinite(w.start) or not math.isfinite(w.end)
                              or w.start < 0 or w.end < w.start or w.start < previous - 0.05
                              or w.end > info.duration + 0.25):
                              bad_timestamps += 1
                          previous = w.end
                  if not sample_timed:
                      bad_timestamps += 1
              elapsed = time.monotonic() - start
              wer = errors / reference_words
              print(f"READ_SPEECH_QA samples={len(rows)} reference_words={reference_words} "
                    f"errors={errors} wer={wer:.4f} audio_seconds={duration:.2f} "
                    f"inference_seconds={elapsed:.2f} timed_words={timed_words} "
                    f"invalid_timestamp_events={bad_timestamps}", flush=True)
              # Provisional clean read-speech screening threshold only; timing
              # range checks do not establish alignment accuracy or editorial quality.
              if wer > 0.15 or bad_timestamps or timed_words == 0:
                  raise SystemExit("READ_SPEECH_QA FAIL")
              print("READ_SPEECH_QA PASS (not production or commercial acceptance)")
          PY
